name: main

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, audit, license, scrub
    runs-on: ubuntu-latest
    # Build-independent gates run as a fast, fail-first job alongside the build
    # job (Turbo's lint/typecheck/test `dependsOn: ["^build"]`; these don't).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Audit (production deps, high+)
        run: pnpm audit --prod --audit-level=high

      - name: License compliance
        run: pnpm license-check

      - name: Scrub gate
        run: bash scripts/scrub-gate.sh

  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    # Lint, typecheck, and test all `dependsOn: ["^build"]`, so a single job lets
    # Turbo build the graph once and reuse its cache across all four tasks.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Kept as separate, ordered steps. A single `turbo run lint typecheck build
      # test` raises concurrency enough to race the demo's nested playground build
      # against its connector builds (and collides two Next builds); the staged
      # order keeps Turbo's topological build deterministic. The Turbo cache above
      # still skips unchanged packages, which is where the real speedup comes from.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Drives the real browser → SDK → collector (DuckDB) → dashboard/replay round
    # trip. Hermetic: the Playwright webServers boot the collector, playground, and
    # dashboard with inline env, so no Docker or repo `.env` is required.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @uptimizr/example-playground test:e2e:install

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            examples/playground/playwright-report
            examples/playground/test-results
          if-no-files-found: ignore
          retention-days: 7

  godot-export-e2e:
    name: Godot export E2E (Playwright)
    runs-on: ubuntu-latest
    # Proves the @uptimizr/godot engine-side shim actually runs (#252): fetches the
    # pinned Godot headless editor + the nothreads Web template (range-fetched out of
    # the 1.2 GB templates bundle, ~85 MB total), exports examples/godot-web-export
    # headlessly, then runs only the godot spec against the same Playwright harness
    # as the `e2e` job. Kept separate so the default suite never needs Godot.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build workspace packages
        run: pnpm build

      # Version + template list must match GODOT_VERSION / GODOT_WEB_TEMPLATES in
      # scripts/godot-common.mjs — bump the key when either changes.
      - name: Cache Godot editor + web export template
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot
          key: godot-${{ runner.os }}-4.7.2-stable-web_nothreads_release-v1

      - name: Fetch Godot (headless editor + web_nothreads_release template)
        run: pnpm godot:fetch

      - name: Verify the sample's shim copy matches the package source
        run: pnpm godot:check-bridge

      - name: Export the sample project (Web, nothreads)
        run: pnpm godot:export

      - name: Install Playwright browser
        run: pnpm --filter @uptimizr/example-playground test:e2e:install

      - name: Run Godot export E2E
        run: pnpm test:e2e:godot
        env:
          # A missing export must fail this job, not skip the spec.
          GODOT_E2E_REQUIRED: "1"

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-godot
          path: |
            examples/playground/playwright-report
            examples/playground/test-results
          if-no-files-found: ignore
          retention-days: 7
