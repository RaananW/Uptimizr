name: Nightly

# The slow, wide checks that would make every PR wait: the full interaction
# matrix (every engine in every scene it builds, `E2E_MATRIX=full`) across the
# whole Playwright suite, and the demo smoke test, against `main` once a night.
# A pull request runs the matrix subset (see `e2e/interaction-matrix.spec.ts`).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    name: E2E full matrix (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # The full matrix adds about 3 minutes to the shard that holds it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_MATRIX: full
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @uptimizr/example-playground test:e2e:install

      - name: Run E2E tests (full matrix)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-shard-${{ matrix.shard }}
          path: |
            examples/playground/playwright-report
            examples/playground/test-results
            examples/playground/e2e/.tmp/collector.log
          if-no-files-found: ignore
          retention-days: 14

  demo-e2e:
    name: Demo E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @uptimizr/demo test:e2e:install

      - name: Run demo E2E tests
        run: pnpm test:e2e:demo

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-demo
          path: |
            oss/apps/demo/playwright-report
            oss/apps/demo/test-results
          if-no-files-found: ignore
          retention-days: 14
