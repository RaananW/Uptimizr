# Optional stores for Uptimizr — ClickHouse, Postgres and SQL Server.
#
# NOT required for the OSS default. The open-source collector self-hosts on a single
# DuckDB file with no external database service (ADR 0020); see the `run-local-stack`
# skill and the root README quickstart. These engines back the optional
# `COLLECTOR_STORE=clickhouse` / `postgres` / `mssql` stores behind the `@uptimizr/db`
# contracts and the cross-engine parity suites.
#
#   docker compose up -d        # start ClickHouse + Postgres + SQL Server (+ Adminer)
#   # run the scale migrations/seed against these engines
#   docker compose down [-v]    # stop (-v also drops data volumes)
#
# Settings mirror `.env.example`; override via a sibling `.env` if needed.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: uptimizr-clickhouse
    environment:
      CLICKHOUSE_DB: uptimizr
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP interface (used by @clickhouse/client)
      # Native protocol — not used by the app (HTTP 8123 is). Host port is
      # configurable to avoid clashes with other local services that default to
      # 9000 (e.g. MinIO): set CLICKHOUSE_NATIVE_HOST_PORT in your .env.
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    container_name: uptimizr-postgres
    environment:
      POSTGRES_USER: uptimizr
      POSTGRES_PASSWORD: uptimizr
      POSTGRES_DB: uptimizr
    ports:
      # Host port is configurable to avoid clashes with other local Postgres
      # instances (set POSTGRES_HOST_PORT in your .env). Container side is 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimizr -d uptimizr"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQL Server 2022 for the optional `COLLECTOR_STORE=mssql` store (#85). The
  # image creates no application database; the collector creates `uptimizr` on
  # first boot (the `sa` login may), and the parity suites use throwaway ones.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uptimizr-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Uptimizr!Local1}"
      MSSQL_PID: Developer
    ports:
      # Host port is configurable to avoid clashes with a local SQL Server
      # (set MSSQL_HOST_PORT in your .env). Container side is 1433.
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' -b',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:4
    container_name: uptimizr-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  mssql-data:
