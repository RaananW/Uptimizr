# The three curated MCP prompt templates `@uptimizr/mcp` ships today
# (ADR 0050 §7) — the canned investigations an MCP client puts in front of a
# user, and therefore the questions the agent is most likely to be asked.
#
# The question text is NOT copied here: `prompt:` names the template and the
# harness renders the real one through `registerPrompts`, so reword a prompt in
# `@uptimizr/mcp` and this case follows automatically.

- id: prompt_weekly_scene_health
  category: sessions
  prompt:
    name: weekly_scene_health
  expectedTools:
    - [event_counts]
    - [timeseries]
    - [perf_summary]
    - [top_meshes]
    - [list_sessions]
  expectedAnswer:
    numbers:
      - { value: 42.2, tolerance: 0.05, label: average FPS }
    phrases: ["camera_sample", "statue"]
    forbiddenPhrases: ["no data", "I don't have"]

- id: prompt_attention_hotspots
  category: attention
  context:
    scene: lobby
  prompt:
    name: attention_hotspots
    args:
      scene: lobby
  expectedTools:
    - [camera_heatmap]
    - [flow_links]
    - [click_rays]
    - [top_meshes]
  expectedAnswer:
    phrases: ["box", "door"]
    forbiddenPhrases: ["no data"]

- id: prompt_xr_comfort_review
  category: xr
  prompt:
    name: xr_comfort_review
  expectedTools:
    - [xr_rotation]
    - [xr_locomotion]
    - [xr_abandonment]
    - [xr_sources]
  expectedAnswer:
    numbers:
      - { value: 3000, label: continuous locomotion milliseconds }
    phrases: ["gaze", "xr-controller"]
    forbiddenPhrases: ["no data"]
