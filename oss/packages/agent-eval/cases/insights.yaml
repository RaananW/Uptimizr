# Derived readings *about* other metrics (ADR 0051 §4): what is normal here, and
# what changed. These are the two questions an agent otherwise re-derives from
# raw rows on every turn, so they are the two the bank most needs to measure.
#
# The range on these cases is a whole day rather than the bank's usual
# two-minute window, because a comparison needs two windows: the harness seeds a
# previous day in `lobby` (`EVAL_PRIOR_DAY_SESSION`) that no other case can see.
# Insight windows are snapped down to whole buckets, so a range must span at
# least one complete bucket to measure anything at all.

- id: insights_baseline_gallery_fps
  category: insights
  question: What is normal FPS for the gallery scene — what should I compare a single reading against?
  context:
    scene: gallery
    since: 1718532000000
    until: 1718618400000
  expectedTools:
    - [insight_baseline]
  expectedArgs:
    insight_baseline:
      metric: perf_summary
  expectedAnswer:
    numbers:
      - { value: 38, label: median FPS baseline for gallery }
    phrases: ["perf_summary", "gallery", "median"]
    forbiddenPhrases: ["no data", "I don't have"]

- id: insights_movers_lobby_week
  category: insights
  # The headline question of the primitive: the lobby lost interactions and
  # dropped 15 FPS against the previous day, and every row is below its
  # `minSample` — which the answer must carry rather than hide.
  question: What changed this week in lobby, and how confident should I be in each change?
  context:
    scene: lobby
    since: 1718532000000
    until: 1718618400000
  expectedTools:
    - [insight_movers]
  expectedArgs:
    insight_movers:
      limit: 5
  expectedAnswer:
    numbers:
      - { value: -15, label: FPS lost against the previous day }
      - { value: 60, label: previous median FPS }
      - { value: -7, label: mesh interactions lost }
    phrases: ["perf_summary", "top_meshes", "aboveMinSample"]
    forbiddenPhrases: ["no data"]

- id: insights_baseline_unknown_metric
  category: insights
  # The recovery case. An agent that guesses a metric name must get back an
  # error it can act on — the id it asked for, and the ids that exist — rather
  # than an opaque validation failure it will simply retry.
  question: What is normal for frames_per_second in this project?
  context:
    since: 1718532000000
    until: 1718618400000
  expectedTools:
    - [insight_baseline]
  expectedArgs:
    insight_baseline:
      metric: frames_per_second
  expectedAnswer:
    phrases: ["unknown metric", "frames_per_second", "perf_summary"]

# --- anomalies (#306) --------------------------------------------------------
#
# `anomalies` is the one primitive that needs a *series* rather than two windows:
# it judges each bucket against the ones before it. The fifteen-day range below
# covers the quiet `lobby` fortnight the harness seeds (`ANOMALY_HISTORY`) and
# stops before `EVAL_T0`'s own day, so the only departures in it are the two that
# were deliberately injected — one bad frame-rate day and one error spike.

- id: insights_anomalies_lobby_fps
  category: insights
  # The headline question: not "what is the FPS" but "was any day wrong, and
  # which". The lobby holds a flat 60 FPS for a fortnight and then reads 25 on
  # 2024-06-12 — a drop no single-window metric would surface.
  question: Was there an FPS anomaly in the lobby last month, and if so which day and how bad was it?
  context:
    scene: lobby
    since: 1717236000000
    until: 1718532000000
  expectedTools:
    - [insight_anomalies]
  expectedArgs:
    insight_anomalies:
      metric: perf_summary
  expectedAnswer:
    numbers:
      - { value: 25, label: median FPS on the anomalous day }
      - { value: 60, label: the level it was expected to hold }
    phrases: ["perf_summary", "lobby", "drop"]
    forbiddenPhrases: ["no data", "I don't have"]

- id: insights_anomalies_error_contributor
  category: insights
  # The contributor half. Two runtime errors a day is the floor; on 2024-06-11
  # thirty engine diagnostics land on top of it, so the answer must name the
  # *channel* rather than only the count — that is the whole point of the
  # attribution scan.
  question: There was a spike in errors in the lobby. Which day was it, and what kind of error accounts for it?
  context:
    scene: lobby
    since: 1717236000000
    until: 1718532000000
  expectedTools:
    - [insight_anomalies]
  expectedArgs:
    insight_anomalies:
      metric: error_heatmap
  expectedAnswer:
    numbers:
      - { value: 32, label: errors on the spike day }
      - { value: 2, label: the ordinary daily error count }
    phrases: ["error_heatmap", "spike", "graphics_diagnostic", "contributor"]
    forbiddenPhrases: ["no data"]
