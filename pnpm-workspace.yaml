# pnpm workspace definition.
packages:
  - "oss/apps/*"
  - "oss/packages/*"
  - "examples/*"

# Dependencies whose install/build scripts are allowed to run (pnpm blocks them by
# default). esbuild ships a platform binary required by vitest; sharp ships native
# image-processing binaries used by Next.js. Using the `allowBuilds` map (pnpm 11+)
# so the approval is persisted in committed config and fresh checkouts / git
# worktrees install non-interactively without an `approve-builds` prompt.
allowBuilds:
  canvas: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - "@babylonjs/core@9.13.0"
  - "@babylonjs/lite@1.2.0"

# Transitive-dependency overrides (`overrides:`) live here when a dependency lags
# behind a security advisory that only an override can force. None are needed at the
# moment (last reviewed 2026-09-06, after 1.0.0: every previous entry — yaml, postcss,
# @hono/node-server, hono, svgo, fast-uri, sharp, find-my-way, brace-expansion,
# esbuild, js-yaml, read-yaml-file — now resolves to a patched version upstream).
#
# When adding one: document the advisory (GHSA id) and the parent that pulls it in,
# cap it to the current major so it cannot force an incompatible major later (the
# read-yaml-file/js-yaml case), and REVIEW at each release: every override is tech
# debt that pins a version the tree did not choose and can silently hold back
# upstream fixes. To check whether an entry is still needed:
#   1. Temporarily comment it out and run `pnpm install`.
#   2. Run `pnpm audit` (advisory cleared upstream?) and `pnpm -r build && pnpm test`.
#   3. If audit stays clean and nothing breaks, delete the entry for good.
